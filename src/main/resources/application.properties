spring.application.name=User Management API
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:userdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Cache / Redis Configuration
spring.cache.type=redis
# Pré-declara os caches para que sejam criados no startup e vinculados
# às métricas pelo CacheMetricsRegistrar (caches lazy não geram métricas).
spring.cache.cache-names=users,usersList
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000
spring.data.redis.client-name=user-management-api
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# Redis Connection Pool
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Actuator Configuration
management.endpoints.web.exposure.include=health,metrics,prometheus,caches
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Metrics Configuration - Enable All
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.cache=true
management.metrics.enable.logback=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

# Prometheus Configuration (Spring Boot 3+/4: propriedade renomeada)
management.prometheus.metrics.export.enabled=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.example=DEBUG
