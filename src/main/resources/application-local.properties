# Perfil "local": cache em memória, sem necessidade de Redis.
# Ative com: --spring.profiles.active=local
spring.cache.type=simple
spring.cache.cache-names=users,usersList

# Actuator Configuration (Local Profile)
management.endpoints.web.exposure.include=health,metrics,prometheus,caches
management.endpoint.health.show-details=always
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Metrics Configuration (Local Profile)
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.cache=true
management.metrics.enable.logback=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

# Prometheus Configuration (Local Profile - Spring Boot 3+/4: propriedade renomeada)
management.prometheus.metrics.export.enabled=true

